name: Export SonarQube report

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: "SonarQube project key"
        required: true
        type: string
      include_hotspots:
        description: "Include security hotspots when API access is available"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  export:
    name: Export Quality Gate and issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate configuration
        shell: bash
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: ${{ inputs.project_key }}
        run: |
          set -euo pipefail
          test -n "$SONAR_HOST_URL" || { echo "::error::Missing repository secret SONAR_HOST_URL"; exit 1; }
          test -n "$SONAR_TOKEN" || { echo "::error::Missing repository secret SONAR_TOKEN"; exit 1; }
          test -n "$PROJECT_KEY" || { echo "::error::Provide the SonarQube project key"; exit 1; }

      - name: Export SonarQube data
        shell: bash
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: ${{ inputs.project_key }}
          INCLUDE_HOTSPOTS: ${{ inputs.include_hotspots }}
        run: |
          set -euo pipefail
          mkdir -p sonar-export
          base="${SONAR_HOST_URL%/}"
          api() {
            curl --fail --silent --show-error --retry 2 --retry-delay 2 \
              --user "$SONAR_TOKEN:" "$base$1"
          }

          api "/api/server/version" > sonar-export/sonar-version.txt
          api "/api/qualitygates/project_status?projectKey=$(printf '%s' "$PROJECT_KEY" | jq -sRr @uri)" \
            > sonar-export/quality-gate.json

          metrics="bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,duplicated_lines, ncloc, sqale_index,security_hotspots"
          metrics="$(printf '%s' "$metrics" | tr -d ' ')"
          api "/api/measures/component?component=$(printf '%s' "$PROJECT_KEY" | jq -sRr @uri)&metricKeys=$metrics" \
            > sonar-export/measures.json

          page=1
          total=1
          while [ "$(( (page - 1) * 500 ))" -lt "$total" ]; do
            api "/api/issues/search?componentKeys=$(printf '%s' "$PROJECT_KEY" | jq -sRr @uri)&resolved=false&ps=500&p=$page" \
              > "sonar-export/issues-page-$page.json"
            total="$(jq -r '.total // 0' "sonar-export/issues-page-$page.json")"
            page=$((page + 1))
          done
          jq -s '{total: (map(.total // 0) | first // 0), issues: (map(.issues // []) | add // [])}' \
            sonar-export/issues-page-*.json > sonar-export/issues.json
          rm sonar-export/issues-page-*.json

          if [ "$INCLUDE_HOTSPOTS" = "true" ]; then
            if api "/api/hotspots/search?projectKey=$(printf '%s' "$PROJECT_KEY" | jq -sRr @uri)&status=TO_REVIEW&ps=500&p=1" \
              > sonar-export/hotspots.json; then
              echo "Hotspots exported."
            else
              rm -f sonar-export/hotspots.json
              echo "Hotspot export was unavailable; continuing with Quality Gate, issues and metrics."
            fi
          fi

          cat > sonar-export/README.md <<'EOF'
          # SonarQube export

          This archive contains a point-in-time export of the selected SonarQube project.
          - `quality-gate.json`: Quality Gate status and conditions.
          - `issues.json`: unresolved issues, including paging combined into one JSON file.
          - `measures.json`: selected project metrics.
          - `sonar-version.txt`: SonarQube server version.
          - `hotspots.json`: included only when requested and the API permits access.

          The export does not contain the API token. Review source-code snippets and internal paths before sharing outside your team.
          EOF

          {
            echo "## SonarQube export"
            echo
            echo "- Project key: `$PROJECT_KEY`"
            echo "- SonarQube version: `$(cat sonar-export/sonar-version.txt)`"
            echo "- Quality Gate: **$(jq -r '.projectStatus.status // "UNKNOWN"' sonar-export/quality-gate.json)**"
            echo "- Unresolved issues exported: **$(jq -r '.issues | length' sonar-export/issues.json)**"
            echo
            echo "Download the `sonarqube-report` artifact below for the full JSON export."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package report
        shell: bash
        run: zip -qr sonarqube-report.zip sonar-export

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report
          path: sonarqube-report.zip
          if-no-files-found: error
          retention-days: 14
