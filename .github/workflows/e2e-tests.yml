name: End-to-end tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/sonar-issues-and-coverage

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Browser E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install project BOM
        run: mvn -B -f pacos-bom/pom.xml install

      - name: Build and install E2E module dependencies without running tests
        run: mvn -B -Pproduction -pl e2e-tests -am install -DskipTests

      - name: Install Playwright Chromium
        run: |
          mvn -B -f e2e-tests/pom.xml \
            -Dexec.classpathScope=test \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps chromium" \
            org.codehaus.mojo:exec-maven-plugin:3.5.0:java

      - name: Run E2E tests only
        run: |
          mvn -B -f e2e-tests/pom.xml test \
            -Dpacos.e2e.skip=false \
            -Dpacos.e2e.browser=true \
            -Djunit.jupiter.execution.parallel.enabled=true \
            -Djunit.jupiter.execution.parallel.mode.default=same_thread \
            -Djunit.jupiter.execution.parallel.mode.classes.default=same_thread \
            -Djunit.jupiter.execution.parallel.config.strategy=fixed \
            -Djunit.jupiter.execution.parallel.config.fixed.parallelism=2 \
            -Djunit.jupiter.execution.parallel.config.fixed.max-pool-size=2

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: |
            e2e-tests/target/surefire-reports/**
            e2e-tests/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14
