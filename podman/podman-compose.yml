version: '3.8'

services:
  pacos:
    image: docker.io/pacosdev/webos:latest
    container_name: pacos
    ports:
      - "8090:8086"
      - "8091:8091"
    volumes:
      - /srv/ci/pacos:/opt/.pacos
    environment:
      JAVA_OPTS: "-Djava.rmi.server.hostname=127.0.0.1"
    restart: unless-stopped
    mem_limit: 2g

  docusaurus:
    image: node:24-bookworm-slim
    container_name: docusaurus
    working_dir: /usr/src/app
    ports:
      - "3000:3000"
    volumes:
      - /home/ubuntu/.ssh/docusaurus:/root/.ssh:ro
    environment:
      GIT_TERMINAL_PROMPT: "0"
      GIT_SSH_COMMAND: >-
        ssh -i /root/.ssh/id_ed25519
        -o IdentitiesOnly=yes
        -o StrictHostKeyChecking=yes
        -o UserKnownHostsFile=/root/.ssh/known_hosts
    command: >
      sh -ec '
        apt-get update &&
        apt-get install -y --no-install-recommends git openssh-client ca-certificates &&
        rm -rf /var/lib/apt/lists/* &&
        mkdir -p /usr/src/app &&
        if [ ! -d /usr/src/app/.git ]; then
          git clone --branch main --depth 1
            git@github.com:pacos-dev/documentation.git /usr/src/app;
        fi &&
        cd /usr/src/app &&
        git fetch --depth=1 origin main &&
        git reset --hard origin/main &&
        npm ci &&
        npm run build &&
        npm install --global serve &&
        exec serve -s build --listen 0.0.0.0:3000
      '
    restart: unless-stopped
    mem_limit: 2g

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    network_mode: "host"
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
    volumes:
      - /srv/ci/jenkins:/var/jenkins_home:Z
    restart: unless-stopped
    mem_limit: 3g

  nexus:
    image: docker.io/sonatype/nexus3
    container_name: nexus
    network_mode: "host"
    ports:
      - "8081:8081"
    volumes:
      - /srv/ci/nexus:/nexus-data:Z
    restart: unless-stopped
    mem_limit: 3g

  sonarqube:
    image: docker.io/library/sonarqube:latest
    container_name: sonarqube
    network_mode: "host"
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - SONAR_JAVA_OPTS=-Xmx3g -Xms512m
    volumes:
      - /srv/ci/sonar/data:/opt/sonarqube/data:Z
      - /srv/ci/sonar/extensions:/opt/sonarqube/extensions:Z
    restart: unless-stopped
    mem_limit: 3g